# sources.lock: every upstream source nextbsd-xlibre builds, pinned.
#
# One line per component:  <name> <version> <sha256> <url>
# <name> matches build_<name> in build-xlibre.sh (hyphens as underscores) and
# patches/<name>/. build-xlibre.sh downloads <url>, refuses it unless its
# SHA-256 is <sha256>, and unpacks it. Only upstream release tarballs (or tag
# archives) are listed: no FreeBSD packages or ports distfiles, no xsrc or
# xenocara. Bumping a version is a deliberate change to this file.
#
# The X client libraries and libxkbfile are not listed: they come from
# nextbsd-xlibs' `continuous` artifact, staged into the sysroot by CI. Nor are
# libdrm, pixman, the font stack, libxkbcommon, xkeyboard-config, epoll-shim,
# libudev-devd, libevdev, mtdev and libinput: they moved to
# nextbsd-displayserver-support (E25, nextbsd-xlibre#12), whose `continuous`
# artifact installs them in /usr.

# ---- server-support libraries and xkbcomp (nextbsd-xlibre#1), in build order ----
# khronos-headers: EGL/ and KHR/ from libglvnd 1.7.0's tag archive (the Khronos
# EGL-Registry has no tags). Build input only, for libepoxy's EGL dispatch;
# not in the artifact (nextbsd-mesa ships these headers).
khronos-headers     1.7.0         2b6e15b06aafb4c0b6e2348124808cbd9b291c647299eaaba2e3202f51ff2f3d  https://gitlab.freedesktop.org/glvnd/libglvnd/-/archive/v1.7.0/libglvnd-v1.7.0.tar.gz
# libepoxy: the GNOME release tarball (upstream's GitHub release has no asset);
# its SHA-256 matches download.gnome.org's libepoxy-1.5.10.sha256sum.
libepoxy            1.5.10        072cda4b59dd098bba8c2363a6247299db1fa89411dc221c8b81b8ee8192e623  https://download.gnome.org/sources/libepoxy/1.5/libepoxy-1.5.10.tar.xz
